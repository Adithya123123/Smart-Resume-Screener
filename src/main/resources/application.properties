# Application Configuration
spring.application.name=smart-resume-screener
server.port=8080

# Database Configuration (H2 In-Memory Database for instant 0-setup execution)
spring.datasource.url=jdbc:h2:mem:resume_screener;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Optional: To use external MySQL Server instead, uncomment the lines below:
# spring.datasource.url=jdbc:mysql://localhost:3306/resume_screener?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# LLM API Configuration
llm.api.key=${LLM_API_KEY:}
llm.api.url=${LLM_API_URL:https://api.openai.com/v1/chat/completions}
llm.model=${LLM_MODEL:gpt-3.5-turbo}
