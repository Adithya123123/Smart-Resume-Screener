# Sample Application Properties for Smart Resume Screener
# Copy this file or set environment variables before running

server.port=8080

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/resume_screener?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD

# LLM API Configuration
# Get your API key from OpenAI or any compatible provider
LLM_API_KEY=YOUR_LLM_API_KEY
LLM_API_URL=https://api.openai.com/v1/chat/completions
LLM_MODEL=gpt-3.5-turbo
